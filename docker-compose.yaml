services:
  db:
    image: pgvector/pgvector:pg16
    container_name: legal-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql  # выполняется только при первом запуске
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - legal-tech-net

  n8n:
    build:
      context: .
      network: host
    container_name: legal-n8n
    restart: always
    ports:
      - "5678:5678"
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=db
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB}
      - DB_POSTGRESDB_USER=${POSTGRES_USER}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - NODE_FUNCTION_ALLOW_BUILTIN=fs,path,child_process,os,crypto
      - N8N_DEFAULT_BINARY_DATA_MODE=filesystem
    volumes:
      - ./n8n_data:/home/node/.n8n
      - ./inbox:/home/node/.n8n-files/lawyer_inbox
    depends_on:
      db:
        condition: service_healthy
    networks:
      - legal-tech-net

  ntfy:
    image: binwiederhier/ntfy
    container_name: legal-ntfy
    command: serve
    environment:
      NTFY_BASE_URL: http://localhost:8080
    ports:
      - "8080:80"
    volumes:
      - ./ntfy_cache:/var/cache/ntfy
    restart: always
    networks:
      - legal-tech-net

  tesseract:
    build: ./ocr-service
    container_name: tesseract-api
    ports:
      - "9091:9091"
    restart: always
    networks:
      - legal-tech-net

networks:
  legal-tech-net:
    driver: bridge
